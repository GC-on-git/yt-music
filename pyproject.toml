[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-music-organizer"
version = "0.1.0"
description = "Local YouTube Music playlist organizer (Streamlit + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YT Music Organizer contributors" }]
dependencies = [
  "streamlit>=1.32.0,<2",
  "pandas>=2.1.0,<3",
  "ytmusicapi>=1.12.0,<2",
  "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9",
  "pytest-cov>=4.1.0,<6",
]

[project.scripts]
ytm-organizer = "src.cli:main"
ytm-setup-auth = "src.cli:setup_auth"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
